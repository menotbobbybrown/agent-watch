[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-watch"
version = "1.0.2"
description = "Universal video engine for any AI agent: download video, extract frames, surface transcripts, and run autonomous visual analysis."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "rabeelashraf & ModelNorth Engineering <menotbobbybrown@gmail.com>"}
]
keywords = ["modelnorth", "ai-agent", "video-processing", "yt-dlp", "ffmpeg", "whisper", "agent-skills"]

dependencies = [
    "yt-dlp>=2024.0.0",
]

[project.scripts]
agent-watch = "watch:main"
agentwatch = "watch:main"

[tool.setuptools]
package-dir = {"" = "skills/watch/scripts"}
py-modules = ["watch", "config", "frames", "transcribe", "whisper", "index", "serve", "setup", "agentwatch"]

[project.urls]
Homepage = "https://github.com/menotbobbybrown/agent-watch"
Repository = "https://github.com/menotbobbybrown/agent-watch"
